Server:
 ServerName: GO
 Address: localhost
 Port: :20509 # 具体后端要暴露的端口
 Model: release # gin模式 # debug
 FrontAddress: http://127.0.0.1:80 # 前端路径
Keys:
 AES-GCM-DB: xxertyuioasdfghjklzxcvbnqwertyui # 32位 真实加密到db使用的
 HMAS: xxx # hmac 哈希列,供查询使用的哈希
 CryptoKey: qweasdzxcrtyfghv # 16位 crypto 加密：生成密码哈希

TheOther:
 Geoip2MMDB: /path/to/dbip-city-lite.mmdb # 使用你的Geoip2MMDB文件,也就是地理位置文件
 SuperID: xxx # 使用你的superID
 StoragePath: /xxx/xxx # 所有文件的存储位置,涉及到video,pic部分
 StorageStatePath: /xxx/xxx/state-storage.log # 存储的状态记录,这里只是记录下存到了哪个id
 
ES:
 Address: http://127.0.0.1:9200
 Username: xxx
 Password: xxx
 
QQ: # 这里我使用qq,当然应该用其他的邮箱也行,但我这个实例直接就没发...
 From: xxx
 Code: xxx
 Host: smtp.qq.com
 Port: 587


Mysql:
 Dialects: mysql
 Host: 127.0.0.1
 Port: 3306
 DB: test
 Username: xx
 Password: xx
 Charset: utf8
 MaxIdle: 2
 MaxOpen: 10

Redis:
 Address: 127.0.0.1:6379
 Password: xxx
 DB: 0
 PoolSize: 10


Slog: # 对应想log的地方跟state的地发
 FileName: /xxx/xxx/log.log
 MaxSize: 100
 MaxBackups: 30
 MaxAge: 30
 StateFileName: /xxx/xxx/state-slog.log

Captcha: # 这是是生成一下简单的图片验证
 Height: 80
 Width: 240
 Length: 5 
 MaxSkew: 0.7 
 DotCount: 80 


